name: Deploy

# Deploys the Worker + static site to Cloudflare on every push to main.
# Requires these repository secrets (Settings → Secrets and variables →
# Actions) — never put real values in this file:
#   CLOUDFLARE_API_TOKEN  — API token with Workers + D1 + R2 edit scope
#   CLOUDFLARE_ACCOUNT_ID — from `npx wrangler whoami` or the dashboard
# D1 migrations are applied as a separate step before deploy so the
# database schema is never behind the code that uses it.
# Until those two secrets are set (Cloudflare is not configured yet: no
# D1 database / R2 bucket created, wrangler.jsonc still holds placeholders),
# the deploy job is SKIPPED instead of failing on every push — wrangler
# cannot run without credentials and a real database id / bucket name.
# Once the secrets are set, the next push to main deploys automatically.
# The CI workflow still typechecks, builds and tests every push meanwhile.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    # Skip (don't fail) while Cloudflare is not configured yet. Without
    # these secrets wrangler fails on every push with exit code 1, which
    # is what was failing the Deploy check on main.
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply the-bd-today-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # PRs get a build-only check (no deploy, no secrets needed). See ci.yml
  # for the full typecheck + test run on pull requests.
  preview-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

name: Deploy

# Deploys the Worker + static site to Cloudflare on every push to main.
# Requires these repository secrets (Settings → Secrets and variables →
# Actions) — never put real values in this file:
#   CLOUDFLARE_API_TOKEN  — API token with Workers + D1 + R2 edit scope
#   CLOUDFLARE_ACCOUNT_ID — from `npx wrangler whoami` or the dashboard
# D1 migrations are applied as a separate step before deploy so the
# database schema is never behind the code that uses it.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply the-bd-today-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # PRs get a build-only check (no deploy, no secrets needed). See ci.yml
  # for the full typecheck + test run on pull requests.
  preview-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

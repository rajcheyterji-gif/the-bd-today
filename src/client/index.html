    <style>
      /* First-paint splash: shown before the JS bundle hydrates, removed
         by React when the app mounts. Plain CSS only — Tailwind is not
         loaded yet at this point. White background, red accent only. */
      .boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #ffffff;
      }
      .boot-splash img {
        width: 240px;
        max-width: 72vw;
        height: auto;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      .boot-bar {
        width: 180px;
        height: 3px;
        background: #e2e8f0;
        overflow: hidden;
      }
      .boot-bar span {
        display: block;
        height: 100%;
        width: 40%;
        background: #c1121f;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(450%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash img,
        .boot-bar span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-label="দ্য বিডি টুডে লোড হচ্ছে">

        <div class="boot-bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
